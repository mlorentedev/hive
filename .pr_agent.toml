# PR-Agent (The-PR-Agent/pr-agent, MIT) on NaN cluster inference.
#
# Why this repo needs a second reviewer, measured rather than assumed (2026-09-06,
# the 34 non-dependabot PRs among the 40 most recent, #356..#412):
#
#   real CodeRabbit review (`## Walkthrough`)   10   (29 %)
#   quota decline (`Review limit reached`)      24   (71 %)
#
# CodeRabbit is not a check-run in this repository, and the required checks are
# `check (3.12)`, `check (3.13)` and the two `cross_worker_lock` jobs, so a declined
# review leaves no trace in CI. Seven PRs in ten here merge with no machine review and
# nothing says so. That is the queue this removes: a reviewer whose capacity is ours
# rather than a vendor's.
#
# Ported from mlorentedev/ts-bridge (`.pr_agent.toml`), itself ported from
# mlorentedev/dotfiles (TOOL-013 #786) via the mlorentedev/kubelab adaptation
# (TOOL-021 #1140). Numbers, paths and the ignore list below are re-derived for this
# repo; the model-chain reasoning is inherited and cited by issue so it can be checked
# at source.

[config]
# The model, its fallback and the token budgets are set by the shared workflow
# (mlorentedev/ci-workflows pr-agent.yml) through environment variables, which sit
# above this file, so they are not repeated here.

response_language = "en-US"

# `AGENTS.md` is the repo's own SSOT overlay and `.claude/CLAUDE.md` the Claude tooling
# overlay (both checked 2026-09-06; there is no root `CLAUDE.md`). Only the first is
# named: the second is harness wiring, and handing the reviewer a source about slash
# commands and skills would spend context on nothing it can review.
repo_context_files = ["AGENTS.md"]

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
persistent_comment = true
final_update_message = false

# No "compliance sweep" preamble: asked for on every review and delivered once in
# sixteen at dotfiles (#1072, recommendation was deletion). An instruction ignored 94 %
# of the time is a comment, not a control.
extra_instructions = """
Classify each finding as REAL, THEORETICAL or SPECULATIVE. State the class as
the first line of its issue_content, alone on that line and spelled exactly
"Class: REAL", "Class: THEORETICAL" or "Class: SPECULATIVE". The triage reads
only that line; a finding without it goes to a human unclassified.

This repository already runs ruff check, ruff format --check, mypy on src/, pytest with
coverage on Python 3.12 and 3.13, the cross-worker lock suite on Linux and Windows, and
a Docker build with a smoke run. Do not restate what those report; repeating it is noise
that trains the reader to skim.

Spend the budget on what static analysis cannot see:

- a test that passes vacuously. This repo has named classes of it: a field asserted in
  only one state (reachable but never unreachable, present but never absent), an
  absence assertion that passes because the whole section is missing (#390), and an
  acceptance criterion that reads green because the live smoke behind it never ran
  (#408). A finding on a test that cannot fail the way its name claims is worth more
  than a style note.
- a guard that cannot fail the way its comment claims, or that perturbs the thing it
  measures.
- error classification that tells the caller the wrong thing to do next. `delegate`
  separates pool-unavailable (retry elsewhere) from task-failed (stop), and unknown
  failures must fall closed to task-failed (docs/lessons/lesson-091). A branch that
  turns a bad answer into a silent retry is a real finding.
- deadline and cancellation semantics: `bounded_call` (ADR-008), the ghost-response
  contract after a cancel ack (ADR-007), and the daemon fallback that must flag
  degraded mode rather than fail or pretend (ADR-011 section 3).
- a second writer to a database the daemon owns (`worker.db`, `usage.db`, the vault
  index), or a commit path that bypasses the outbox queue (ADR-018).
- cross-file consequences a single-hunk reader misses: a claim repeated in README,
  AGENTS.md, `docs/runbooks/`, `site/src/content/docs/` and the server's own prompt
  text in `src/hive/server.py` where only one of them is edited, or a settings name
  documented that `HiveSettings` does not read.
- anything that puts a credential in a transcript, a log line, an argv, a crash
  artifact or the process table, including in documentation examples. `worker_status`
  and `vault_health` are asserted to carry none (#390 AC7).

A REAL finding needs a concrete
trace: file and line, failing input, or a command and its output. Do not flag an import
or dependency as missing when CI compiles and tests pass; trust the manifests. Write in
English. Conventional Commits and no AI attribution are enforced here, so do not propose
commit messages that carry either.
"""

[pr_code_suggestions]
# Present on purpose. Omitting this block is how upstream shipped the tool with its
# stated function disabled: the default `dual_publishing_score_threshold` is -1, which
# never publishes inline (dotfiles measured 2 bot comments and 0 inline across three
# PRs before noticing). 7 is upstream's own medium boundary.
dual_publishing_score_threshold = 7
suggestions_score_threshold = 5
publish_output_no_suggestions = false

[ignore]
# Applied BEFORE the model call. This repo keeps no credential material in-tree (no
# SOPS/age store, no keys — the only secrets live in GitHub's own stores), so this list
# is about spend and signal, not leakage:
#   - the site build output and coverage files are machine artefacts (all gitignored,
#     listed so a stray commit does not get reviewed as code);
#   - `uv.lock` and the docs-site lockfile are thousands of lines of resolved URLs a
#     human already reviewed in the PR that bumped them, and lockfiles are excluded
#     from the review cap by policy;
#   - archived specs are a closed audit trail, re-reviewing them spends inference on
#     text that has already been reviewed once.
glob = [
  "specs/archive/**",
  "site/dist/**",
  "site/package-lock.json",
  "uv.lock",
  "**/*.log",
  "coverage.xml",
  ".coverage",
]
