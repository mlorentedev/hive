name: Repo hygiene

# Two guards: the lessons check runs dotf through the fleet's hygiene composite
# (ci-workflows CI-005), and the SHA-pin script runs under bash and zsh.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lessons numbering and format
        uses: mlorentedev/ci-workflows/.github/actions/hygiene@2355330358344bb08c0b7a305be4ed6488f23d0c # v0.6.0
      - name: Actions pinned to commit SHAs
        run: bash scripts/check-actions-pinned.sh
