name: pr-agent

# The reviewer whose capacity is ours rather than a vendor's.
#
# Measured here on 2026-09-06, over the 34 non-dependabot PRs among the 40 most recent
# (#356..#412): 10 carried a real CodeRabbit review (`## Walkthrough`), 24 carried
# `Review limit reached`. CodeRabbit publishes no check-run in this repository, and the
# required checks are `check (3.12)`, `check (3.13)` and the two `cross_worker_lock`
# jobs, so a declined review is invisible to CI and seven PRs in ten merge unread by any
# machine. This workflow does not replace CodeRabbit — it makes the absence impossible
# to mistake for a pass, and it reviews when the vendor's quota is spent.
#
# Ported from mlorentedev/ts-bridge, itself a port of mlorentedev/dotfiles (TOOL-013
# #786) through the mlorentedev/kubelab adaptation (TOOL-021 #1140). The exclusions
# below are re-derived from THIS repo's configuration; each one is annotated with what
# was checked here.
#
# The name `pr-agent` is a two-file agreement in the repos that have the attestation
# gate: `review-attestation.yml` declares `workflow_run: workflows: [pr-agent]` so the
# verdict is re-read after this job finishes. hive has no gate workflow, and its
# harness/review-attestation.json deliberately omits the `escape` and `exempt` blocks
# that gate reads, so nothing depends on this name today — when a gate lands, it must
# name this workflow exactly.

on:
  pull_request:
    # `synchronize` is here so a push gets read, and it is deliberately NOT in
    # `pr_actions` below: upstream routes synchronize through `handle_push_trigger`
    # instead, so listing it there is a setting that looks right and asserts nothing
    # (dotfiles #1053).
    types: [opened, synchronize, reopened, ready_for_review]
  # Slash commands (`/review`, `/improve`, `/describe`) on an existing PR.
  issue_comment:
    types: [created]

concurrency:
  # The event name is part of the key and it is load-bearing. A PR comment is an
  # `issue_comment` whose `issue.number` IS the PR number, so without it a comment
  # triggered run shares this group with the in-flight `pull_request` run and
  # `cancel-in-progress` kills the review. PR-Agent is a Docker action that spends its
  # first ~20 s building, and CodeRabbit's auto-summary comment lands inside that
  # window reliably — measured upstream on two PRs: both cancelled mid-build, both
  # green, zero reviews produced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the review comments are the product
  issues: write          # slash-command replies land as issue comments

jobs:
  review:
    # Four conditions, each doing its own work:
    #
    # 1. `issue_comment` fires on issues too, and an issue has no diff.
    # 2. Draft PRs are not asking to be read yet.
    # 3. Dependabot runs are excluded on `github.actor`, and the reason is measured
    #    here rather than inherited: this repo's Dependabot secret store is EMPTY
    #    (`dependabot/secrets` -> total_count: 0, checked 2026-09-06) while pip, npm
    #    (/site), github-actions and docker file weekly. On a Dependabot-triggered run GitHub
    #    serves a different secrets store, so `secrets.NAN_API_KEY` expands to "",
    #    LiteLLM cannot authenticate, PR-Agent swallows the failure and exits green —
    #    and the guard step below then fails every weekly bump. Keyed on the actor
    #    because that is the same field GitHub reads to choose the store, so the skip
    #    fires exactly when the credential is missing. It is also unforgeable, which a
    #    branch name is not. A human pushing to a dependabot branch is a different
    #    actor with the secrets present, and gets a real review.
    # 4. Release PRs are excluded, because reviewing them is structurally noise:
    #    release-please restates commits that were each reviewed when they landed, and
    #    PR-Agent's ticket-compliance pass reads the CHANGELOG's issue references, looks
    #    for their code in the diff, and reports "no requirements fulfilled" every time.
    #    Measured here: the head ref is `release-please--branches--master` (PR #393,
    #    the 4.1.0 release) and it is authored by `mlorentedev` through
    #    RELEASE_PLEASE_TOKEN, not a bot — so an actor rule would not fire
    #    and a name rule is the only one that can. Doing it at the workflow layer rather
    #    than in `.pr_agent.toml` is deliberate: `ignore_pr_source_branches` was measured
    #    inert on the Action path (dotfiles #1073).
    #
    #    A borrowed branch name cannot game this into a review: the exclusion only ever
    #    REMOVES one, and the attestation gate's own release exemption is keyed on diff
    #    signature, never on a name.
    #
    # On `issue_comment` there is no `head.ref`, so condition 4 is evaluated only on the
    # pull_request half. A human typing `/review` on a release PR is asking on purpose.
    #
    # The author_association gate matters because this repository is PUBLIC:
    # `issue_comment` runs in the base repo context with secrets available, so without
    # it any account could spend the inference budget and exercise
    # `pull-requests: write` on demand. The set is the one the review registry already
    # treats as belonging here.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false
        && github.actor != 'dependabot[bot]'
        && github.event.pull_request.head.repo.fork == false
        && !startsWith(github.event.pull_request.head.ref, 'release-please--')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `The-PR-Agent/pr-agent`, not `qodo-ai/pr-agent` as #786's body says: the
      # project has been renamed and the old path now redirects. Pinned to a tag
      # that was verified to exist and to carry an `action.yaml` (a Docker
      # action) — the first draft of this file pinned `@v0.30`, which does not
      # exist at all.
      # Captured BEFORE PR-Agent runs so the guard below can bind its verdict to
      # THIS run: with `persistent_comment` PR-Agent edits its earlier Guide, which
      # moves `updated_at`; a Guide left by a previous run and never touched by
      # this one stays older than this stamp and no longer satisfies the guard.
      - name: Stamp run start
        id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # PR-Agent swallows an authentication failure and exits green, so without
      # this step a missing secret surfaces only as "published no review" with a
      # NaN-concurrency diagnosis that is wrong. Measured 2026-09-06 on the ten
      # repositories that received this workflow before their NAN_API_KEY was
      # synced. Fail here, with the remedy, before spending a run on it.
      # `secrets` is not an allowed context in a step `if:` (actionlint: expression),
      # so the presence test travels as a boolean env var; the value never does.
      - name: Fail if the reviewer has no credential
        id: credential
        env:
          HAS_NAN_API_KEY: ${{ secrets.NAN_API_KEY != '' }}
        run: |
          if [ "${HAS_NAN_API_KEY}" != "true" ]; then
            echo "::error::NAN_API_KEY is not set in this repository's Actions secrets, so PR-Agent cannot review."
            echo "::error::Remedy: add ci:${GITHUB_REPOSITORY} to NAN_API_KEY's consumers in" \
              "dotfiles/secrets/registry.yaml, then run: dotf secrets sync ci --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
      - name: PR-Agent
        uses: The-PR-Agent/pr-agent@ab6ec54bfeb37933ddb74259338752e9272016c6  # v0.44.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.NAN_API_KEY }}
          OPENAI__API_BASE: https://api.nan.builders/v1
          # PR-Agent loads `.pr_agent.toml` from the DEFAULT branch ("No .pr_agent.toml
          # found; using existing settings" on every bootstrap PR, 2026-09-06), so the
          # PR that introduces the file reviews with upstream's gpt-5.6 and NaN rejects
          # the key. The workflow file IS read from the PR head, so the model travels
          # here and the toml keeps every other setting. Env wins over the file in
          # PR-Agent's settings order; keep the two in step.
          CONFIG__MODEL: openai/mimo-v2.5
          CONFIG__FALLBACK_MODELS: '["openai/deepseek-v4-flash"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "200000"
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          # Stated rather than defaulted, so the event lists are visible. `synchronize`
          # is absent for the reason in the trigger comment above, and `push_commands`
          # names `/review` ONLY because upstream's default is `['/describe','/review']`
          # — enabling the push trigger without this line would quietly reinstate
          # describe and undo the decision below.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          # `describe` REWRITES the PR body, and the bodies here carry hand-written
          # measurement tables, merge rationale and reviewer dispositions — the part
          # worth reading. Off as a decision, not by omission.
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          # Suggestions off on the automatic path to halve inference per PR: NaN allows a
          # small number of concurrent requests shared with every other consumer of this
          # key, including the adversarial-review pool in the sibling repos. `## PR Code
          # Suggestions` is also deliberately NOT a review marker in
          # harness/review-attestation.json — suggestions cannot attest a review, so the
          # second call could never turn anything green while competing with the one that
          # can. `/improve` on demand still works: the [pr_code_suggestions] config stays.
          github_action_config.auto_improve: "false"

      # A review that did not happen must not report success (#1107).
      #
      # PR-Agent swallows a failed inference into a clean exit. Measured on run
      # 32325012314: green job, no review, because the model returned
      # `litellm.RateLimitError: deepseek-v4-flash concurrency limit: max 5
      # simultaneous requests`. Six PRs in one session were affected. ADR-032
      # already forbids it — the top tier "queues or escalates, NEVER degrades
      # silently" — so this makes the degrade loud and does nothing else.
      #
      # `fallback_models` names mimo-v2.5 for CONCURRENCY (per-model limit,
      # measured), never to soften the quality bar. The marker comes from the
      # registry, over the API since this job has no checkout, at the BASE ref
      # since a PR supplying it could redefine it. Two more bindings, both
      # measured as gaps by CodeRabbit on the yt-metrics-cli and svqtriana ports
      # (2026-09-06): the comment must be AUTHORED by github-actions[bot] (on a
      # public repo anyone can paste the marker text), and it must have been
      # created or edited at or after this run's start stamp (`persistent_comment`
      # edits the earlier Guide, which moves `updated_at`, so an untouched Guide
      # from a previous run cannot vouch for this one). See #1107.
      - name: Fail if no review was published
        # Only the paths that actually run `/review`. An issue_comment invoking
        # `/describe` or `/improve` legitimately publishes no Guide, and failing
        # those would teach the reader to ignore this check.
        # `always()` would also run this after the credential step failed and stack a
        # wrong NaN-concurrency diagnosis on top of the remedy; skip it in that case.
        if: >
          always() && steps.credential.outcome != 'failure'
            && (github.event_name == 'pull_request'
              || (github.event_name == 'issue_comment'
                  && contains(github.event.comment.body, '/review')))
        env:
          # `github.token`, not `secrets.GITHUB_TOKEN`: identical value, but it is
          # the automatic token rather than a declared repository secret, so the
          # "exactly one secret" guard keeps counting what it was written to count.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          STARTED: ${{ steps.start.outputs.started }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          read_marker() { # $1 = ref; prints the marker or nothing; never aborts the step
            gh api "repos/${GITHUB_REPOSITORY}/contents/harness/review-attestation.json?ref=$1" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
              | jq -r '.reviewers[] | select(.login == "github-actions") | .review_markers[0] // empty' 2>/dev/null || true
          }
          marker=$(read_marker "${BASE_REF}")
          if [ -z "$marker" ] && [ -z "${HEAD_SHA:-}" ]; then
            # issue_comment events carry no pull_request payload; ask the API for the head.
            HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null || true)
          fi
          if [ -z "$marker" ] && [ -n "${HEAD_SHA:-}" ]; then
            # The base has no registry (or no github-actions entry) yet: this is the PR
            # that introduces it. Reading the marker from the PR head is safe because the
            # comment must still be AUTHORED by github-actions[bot] after this run's
            # start, which a PR cannot forge. Without this fallback the bootstrap PR of
            # every repository failed with a bare "exit code 1" (gh 404 under pipefail).
            marker=$(read_marker "${HEAD_SHA}")
            [ -n "$marker" ] && echo "::notice::review marker read from the PR head: the base ref has no reviewer registry yet"
          fi
          if [ -z "$marker" ] || [ "$marker" = "null" ]; then
            echo "::error::no review marker declared for github-actions in" \
              "harness/review-attestation.json (checked ${BASE_REF} and the PR head)"
            exit 1
          fi
          # --paginate emits one JSON array per page; `jq -s` slurps them into one
          # array of arrays so the count spans every page (gh's own --slurp flag is
          # not present on the runner's gh 2.46 and printed usage instead).
          found=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            | jq -s --arg started "${STARTED}" --arg marker "${marker}" \
                '[.[][] | select(.user.login == "github-actions[bot]"
                                 and (.updated_at >= $started)
                                 and (.body | contains($marker)))] | length')
          if [ "$found" -gt 0 ]; then
            echo "review published (marker: ${marker})"
            exit 0
          fi
          echo "::error::PR-Agent reported success but published no review" \
            "(no github-actions[bot] comment updated since ${STARTED} carries \"${marker}\")."
          echo "::error::Most likely cause: NaN concurrency exhaustion — the cluster allows 5 simultaneous"
          echo "::error::requests, shared with pi, qq and hive embeddings. See #1107."
          exit 1
