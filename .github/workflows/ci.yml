name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv venv && uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest tests/ -v --cov=hive --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build
        run: uv build

  cross_worker_lock:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install
        run: uv venv && uv pip install -e ".[dev]"

      - name: Test cross-worker lock
        run: uv run pytest tests/test_cross_worker_lock.py -m cross_worker -v

      # The classifier is excluded from the default run by the `diagnostic`
      # marker, so this step must select it explicitly — a nodeid alone is still
      # filtered by addopts and would collect nothing (pytest exit 5).
      #
      # continue-on-error, deliberately: this test reports how cancellation races
      # distribute, and its own docstring says it is not a pass/fail correctness
      # test. Its output is worth having on every run; its failure is not worth
      # blocking a merge, because a red here means the 20-iteration harness did
      # not fit the runner's timing, not that the shim regressed.
      - name: Test cancellation race (diagnostic, non-blocking)
        continue-on-error: true
        run: uv run pytest tests/test_compat_shim.py::test_classify_cancellation_race -m diagnostic -v

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t hive-vault:ci .

      - name: Smoke test
        run: |
          # Import check: the image ENTRYPOINT is `hive-vault`, so override it to
          # run python directly. (A bare `... python -c ...` would pass `python`
          # as an argument to the hive CLI, not run the interpreter.)
          docker run --rm --entrypoint python hive-vault:ci -c "from hive.server import create_server; print('OK')"
          # CLI check: the entrypoint prints a version and exits 0 — never boots
          # the blocking stdio server on a flag.
          docker run --rm hive-vault:ci --version
