name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Install exactly what uv.lock pins, and fail if the lock is stale. The
      # old `uv pip install -e .` resolved fresh from pyproject.toml, then the
      # first `uv run` silently re-synced to the lock, so the log showed one
      # resolution and the tests ran on another (#434).
      - name: Install
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest tests/ -v --cov=hive --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build
        run: uv build

  cross_worker_lock:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install
        run: uv sync --locked --extra dev --python 3.12

      - name: Test cross-worker lock
        run: uv run pytest tests/test_cross_worker_lock.py -m cross_worker -v

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t hive-vault:ci .

      - name: Smoke test
        run: |
          # Import check: the image ENTRYPOINT is `hive-vault`, so override it to
          # run python directly. (A bare `... python -c ...` would pass `python`
          # as an argument to the hive CLI, not run the interpreter.)
          docker run --rm --entrypoint python hive-vault:ci -c "from hive.server import create_server; print('OK')"
          # CLI check: the entrypoint prints a version and exits 0 — never boots
          # the blocking stdio server on a flag.
          docker run --rm hive-vault:ci --version
