name: Add to bitácora

# Puts every opened/reopened issue and PR onto the cross-repo bitácora board
# (GitHub Project #1). Pairs with bitacora-status.yml (which flips an assigned
# issue to In Progress). Canonical copy for the OPS-002 (#258) multi-repo rollout.
#
# Dependabot PRs are deliberately excluded (board hygiene): a version bump is not
# work to triage — its record lives in CHANGELOG + git history. This also avoids
# needing a duplicate BITACORA_PAT in the Dependabot secret store: GitHub isolates
# Dependabot secrets from Actions secrets, so excluding the trigger means only the
# Actions secret is required (halves the rotation surface across repos).



on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    # Fork PRs run without repository secrets — BITACORA_PAT would be empty and the
    # job would fail (Codex review on kubelab#237). Skip them; fork PRs reach the
    # board via the rollout backfill or a manual item-add.
    # Dependabot PRs are excluded from the board (see header comment for rationale).
    if: github.event_name == 'issues' || (github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # Issues: use the official action (works fine for issues)
      - name: Add issue to project
        if: github.event_name == 'issues'
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/mlorentedev/projects/1
          github-token: ${{ secrets.BITACORA_PAT }}

      # PRs: gh project item-add can't resolve owner type for user projects.
      # Use the GraphQL API directly: resolve projectId → add item by node_id.
      - name: Add PR to project
        if: github.event_name == 'pull_request'
        run: |
          PROJECT_ID=$(gh api graphql -f query='
            { user(login: "mlorentedev") { projectV2(number: 1) { id } } }
          ' --jq '.data.user.projectV2.id')
          gh api graphql -f query='
            mutation($pid: ID!, $cid: ID!) {
              addProjectV2ItemById(input: { projectId: $pid, contentId: $cid }) {
                item { id }
              }
            }
          ' -f pid="$PROJECT_ID" -f cid="${{ github.event.pull_request.node_id }}"
          echo "PR added to bitácora project"
        env:
          GH_TOKEN: ${{ secrets.BITACORA_PAT }}
