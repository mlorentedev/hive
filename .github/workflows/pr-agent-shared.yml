name: pr-agent-shared

# The reusable reviewer from mlorentedev/ci-workflows, beside pr-agent.yml for the
# side-by-side week of TOOL-031 (dotfiles#2893, hive#503). PR-D removes the old job.
# Both jobs share one repository-wide lane, so they queue rather than collide.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: mlorentedev/ci-workflows/.github/workflows/pr-agent.yml@a7ece3a8f135af5895dd06f06d676da57d0d5dfa # v0.1.0
    with:
      dotf_version: 0.78.0
      pool: embedded
      declared_model: openai/mimo-v2.6-flash
      declared_fallback_models: '["openai/deepseek-v4-flash", "openai/glm5.3-flash"]'
    secrets:
      NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
      PR_AGENT_ANTHROPIC_API_KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
