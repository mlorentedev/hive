name: pr-agent-shared

# The reusable reviewer from mlorentedev/ci-workflows, beside pr-agent.yml for the
# side-by-side week of TOOL-031 (dotfiles#2893, hive#503). PR-D removes the old job.
# Both jobs share one repository-wide lane, so they queue rather than collide.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: mlorentedev/ci-workflows/.github/workflows/pr-agent.yml@d601782ceac77ad4dc52833cd94106245ee20f44 # v0.4.0
    # dotf_version and the model chain take the tag's defaults: the dotf release it
    # was tested with, and the chain read from the pool.
    with:
      pool: embedded
      # Release PRs restate commits each reviewed when it landed. Since v0.2.0 the
      # caller names the prefix; without it they would be reviewed again.
      skip_branch_prefixes: release-please--
    secrets:
      NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
      PR_AGENT_ANTHROPIC_API_KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
