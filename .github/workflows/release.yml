name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      republish_mcp:
        description: "Re-publish current server.json to the MCP Registry (skip release-please/PyPI)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: python
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # release-please bumps `pyproject.toml` and `server.json` (via extra-files)
      # but does not touch `uv.lock`'s self-reference, so the release PR ships
      # with a stale lock version. Regenerate the lock on the release-please
      # branch so the merged PR is internally consistent.
      - name: Capture release-please PR branch
        if: steps.release.outputs.pr
        env:
          PR_DATA: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(printf '%s' "$PR_DATA" | jq -r .headBranchName)
          echo "PR_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Check out release-please PR branch
        if: steps.release.outputs.pr
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR_BRANCH }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Set up uv
        if: steps.release.outputs.pr
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        if: steps.release.outputs.pr
        run: uv python install 3.12

      - name: Sync uv.lock with release version bump
        if: steps.release.outputs.pr
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "No uv.lock drift to fix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with release version bump"
          git push origin "$PR_BRANCH"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    needs: publish
    if: |
      always() &&
      (
        needs.publish.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.republish_mcp)
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          set +e
          output=$(./mcp-publisher publish 2>&1)
          rc=$?
          echo "$output"
          if [ $rc -eq 0 ]; then
            exit 0
          fi
          # Tolerate ONLY the specific "duplicate version" error from the
          # registry — anything else is a real failure.
          if echo "$output" | grep -q "cannot publish duplicate version"; then
            echo "::warning::MCP Registry already has this version — nothing to do."
            exit 0
          fi
          echo "::error::mcp-publisher publish failed with an unexpected error."
          exit $rc
