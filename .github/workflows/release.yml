name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      republish_mcp:
        description: "Re-publish current server.json to the MCP Registry (skip release-please/PyPI)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    needs: publish
    if: |
      always() &&
      (
        needs.publish.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.republish_mcp)
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          set +e
          output=$(./mcp-publisher publish 2>&1)
          rc=$?
          echo "$output"
          if [ $rc -eq 0 ]; then
            exit 0
          fi
          # Tolerate ONLY the specific "duplicate version" error from the
          # registry — anything else is a real failure.
          if echo "$output" | grep -q "cannot publish duplicate version"; then
            echo "::warning::MCP Registry already has this version — nothing to do."
            exit 0
          fi
          echo "::error::mcp-publisher publish failed with an unexpected error."
          exit $rc
