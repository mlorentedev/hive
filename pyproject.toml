[project]
name = "hive-vault"
version = "1.37.0"
description = "Unified MCP server for AI-assisted development — on-demand Obsidian vault access + worker delegation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Manuel Lorente" }]
keywords = ["mcp", "obsidian", "vault", "context-management", "ai-coding", "knowledge-management", "model-context-protocol", "claude-code", "gemini-cli", "codex-cli", "worker-delegation", "token-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastmcp>=2.0.0",
    "filelock>=3.13",
    "httpx>=0.27.0",
    # Pinned because src/hive/_compat.py monkey-patches private
    # attributes on mcp.shared.session.RequestResponder
    # (_completed, _on_complete, _entered, _cancel_scope, __exit__,
    # respond). Any minor bump can rename these silently. Upstream
    # tracker for the cancel-race the shim fixes:
    # https://github.com/modelcontextprotocol/python-sdk/issues/2610
    # Cap at <2.0 so a deliberate review happens before adopting
    # any new major release. Bump the lower bound when verifying a
    # newer release; bump the upper bound only after auditing the
    # _compat shim against the new internals.
    # 1.27.2 audited 2026-05-31: tests/test_compat_shim.py (incl. the
    # real-subprocess cancel-race) passes — the patched RequestResponder
    # internals are unchanged.
    "mcp>=1.27,<2.0",
    "psutil>=5.9.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-psutil>=5.9.0",
]
# HIVE-211: optional semantic retrieval (vault_ask). Heavy/native deps stay
# behind this extra so a base ``pip install hive-vault`` pulls nothing extra
# and never fails to import when the extra is absent.
semantic = [
    "numpy>=1.26",
]

[project.scripts]
hive = "hive.server:main"
hive-vault = "hive.server:main"

[project.urls]
Homepage = "https://github.com/mlorentedev/hive"
Documentation = "https://mlorentedev.github.io/hive/"
Repository = "https://github.com/mlorentedev/hive"
Issues = "https://github.com/mlorentedev/hive/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# numpy ships with the optional [semantic] extra (HIVE-211); it is absent from
# base + dev installs, so its import in _vault_ask is probed behind try/except.
# Tell mypy the missing module is expected rather than a type error.
[[tool.mypy.overrides]]
module = ["numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: end-to-end tests against real Ollama/OpenRouter (skip in CI)",
    "cross_worker: HIVE-116 multi-process integration tests (excluded from default run, requires fake-git PATH fixture)",
]
addopts = "-m 'not smoke and not cross_worker'"
