[project]
name = "hive-vault"
version = "4.2.1"
description = "Unified MCP server for AI-assisted development — on-demand Obsidian vault access + worker delegation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Manuel Lorente" }]
keywords = ["mcp", "obsidian", "vault", "context-management", "ai-coding", "knowledge-management", "model-context-protocol", "claude-code", "gemini-cli", "codex-cli", "worker-delegation", "token-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # The >=2.0.0 floor was unsatisfiable: src/hive/_client.py imports
    # fastmcp.server.providers.proxy.FastMCPProxy, which exists only from
    # 3.x on (2.x exposed it as fastmcp.server.proxy), and _diagnostics.py
    # needs fastmcp.server.middleware, absent in 2.0.0. A resolver that
    # honoured the old floor produced an install that could not import.
    # Note fastmcp 3.x is a metadata-only meta-package: it pins
    # fastmcp-slim[client,server]==<same version>, and all code ships in
    # fastmcp-slim under the shared `fastmcp/` namespace. A partial or
    # skewed upgrade across that split leaves importable-looking installs
    # missing real submodules — see #319.
    # 4.x is the line built on mcp 2.x (see the mcp pin below); 3.x pulls
    # mcp 1.x, which nothing patches any more. Bounds are asserted by
    # tests/test_dependency_bounds.py, so moving to another major means
    # auditing it and editing that test too (#434).
    # 4.0.9 audited 2026-09-24: full suite green.
    "fastmcp>=4,<5",
    "filelock>=3.13",
    "httpx>=0.27.0",
    # 2.x on purpose (#434). On 1.x a response produced after its request
    # was cancelled tripped `assert not self._completed` and killed the
    # server (python-sdk#2416), and hive carried a monkey-patch for it. The
    # 2.x dispatcher never answers a cancelled request, so no patch is
    # needed, and the floor keeps 1.x out because nothing patches it now.
    # Bounds are asserted by tests/test_dependency_bounds.py: Dependabot's
    # semver-major ignore rule does not stop range widening (#316, #369).
    # tests/test_cancel_race.py is the behavioural guard.
    # 2.2.0 audited 2026-09-24: full suite green, cancel race 0/3 crashes.
    "mcp>=2.2,<3",
    "psutil>=5.9.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-psutil>=5.9.0",
    # tests/test_dependency_bounds.py parses the declared bounds; declared
    # here rather than relied on through pytest's own dependency.
    "packaging>=23",
    # HIVE-211 PR3: numpy in dev so the retrieval engine tests always run;
    # the "extra absent" branch is tested via monkeypatching, not by
    # genuinely removing numpy from the install.
    "numpy>=1.26",
]
# HIVE-211: optional semantic retrieval (vault_ask). Heavy/native deps stay
# behind this extra so a base ``pip install hive-vault`` pulls nothing extra
# and never fails to import when the extra is absent.
semantic = [
    "numpy>=1.26",
]

[project.scripts]
hive = "hive.server:main"
hive-vault = "hive.server:main"

[project.urls]
Homepage = "https://github.com/mlorentedev/hive"
Documentation = "https://mlorentedev.github.io/hive/"
Repository = "https://github.com/mlorentedev/hive"
Issues = "https://github.com/mlorentedev/hive/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# numpy ships with the optional [semantic] extra (HIVE-211); it is absent from
# base + dev installs, so its import in _vault_ask is probed behind try/except.
# Tell mypy the missing module is expected rather than a type error.
[[tool.mypy.overrides]]
module = ["numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: end-to-end tests against real Ollama/OpenRouter (skip in CI)",
    "cross_worker: multi-process integration tests and benchmarks (excluded from default run; the HIVE-116 lock tests also require a fake-git PATH fixture)",
    "diagnostic: empirical classifiers that report a distribution rather than assert a contract (excluded from default run; they must never gate a merge)",
]
addopts = "-m 'not smoke and not cross_worker and not diagnostic'"
